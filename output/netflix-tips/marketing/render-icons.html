<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Icon Renderer — Netflix Tips</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 40px; background: #f5f5f5; }
    h1 { margin-bottom: 24px; }
    .icons { display: flex; gap: 32px; align-items: flex-end; }
    .icon-group { text-align: center; }
    canvas { border: 1px solid #ddd; border-radius: 8px; background: white; }
    button { margin-top: 8px; padding: 6px 16px; border: none; border-radius: 6px; background: #E50914; color: white; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .label { font-size: 12px; color: #666; margin-top: 4px; }
    .note { margin-top: 24px; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🎬 Netflix Tips — Icon Renderer</h1>
  <p class="note">These are simplified canvas approximations. For best quality, use the SVG files in imgs/ converted via sharp-cli.</p>
  <div class="icons">
    <div class="icon-group">
      <canvas id="c16" width="16" height="16"></canvas>
      <div class="label">16x16</div>
      <button onclick="download('c16','icon-16.png')">Download</button>
    </div>
    <div class="icon-group">
      <canvas id="c48" width="48" height="48"></canvas>
      <div class="label">48x48</div>
      <button onclick="download('c48','icon-48.png')">Download</button>
    </div>
    <div class="icon-group">
      <canvas id="c128" width="128" height="128"></canvas>
      <div class="label">128x128</div>
      <button onclick="download('c128','icon-128.png')">Download</button>
    </div>
  </div>
  <script>
    function drawIcon(canvasId, size) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      const s = size / 128;
      const r = 28 * s;

      // Rounded rect background with gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#E50914');
      grad.addColorStop(1, '#831010');
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, r);
      ctx.fillStyle = grad;
      ctx.fill();

      // Film strip bars (subtle)
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.roundRect(8*s, 0, 12*s, size, 2*s);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(108*s, 0, 12*s, size, 2*s);
      ctx.fill();

      // Lightbulb body with gradient
      const bulbGrad = ctx.createLinearGradient(64*s, 26*s, 64*s, 74*s);
      bulbGrad.addColorStop(0, '#FFF3B0');
      bulbGrad.addColorStop(1, '#FFD93D');
      ctx.beginPath();
      ctx.ellipse(64*s, 50*s, 22*s, 24*s, 0, 0, Math.PI * 2);
      ctx.fillStyle = bulbGrad;
      ctx.fill();

      // Screw base
      ctx.fillStyle = '#E0E0E0';
      ctx.beginPath();
      ctx.roundRect(54*s, 72*s, 20*s, 6*s, 3*s);
      ctx.fill();
      ctx.fillStyle = '#CCCCCC';
      ctx.beginPath();
      ctx.roundRect(56*s, 78*s, 16*s, 5*s, 2.5*s);
      ctx.fill();
      ctx.fillStyle = '#B8B8B8';
      ctx.beginPath();
      ctx.roundRect(58*s, 83*s, 12*s, 4*s, 2*s);
      ctx.fill();

      // Sparkle
      if (size >= 32) {
        drawSparkle(ctx, 90*s, 22*s, 8*s, 'rgba(255,255,255,0.9)');
        if (size >= 48) {
          drawSparkle(ctx, 34*s, 28*s, 5*s, 'rgba(255,255,255,0.7)');
        }
      }
    }

    function drawSparkle(ctx, x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r*0.2, y - r*0.25);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x + r*0.2, y + r*0.25);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r*0.2, y + r*0.25);
      ctx.lineTo(x - r, y);
      ctx.lineTo(x - r*0.2, y - r*0.25);
      ctx.closePath();
      ctx.fill();
    }

    function download(canvasId, filename) {
      const c = document.getElementById(canvasId);
      const a = document.createElement('a');
      a.download = filename;
      a.href = c.toDataURL('image/png');
      a.click();
    }

    drawIcon('c16', 16);
    drawIcon('c48', 48);
    drawIcon('c128', 128);
  </script>
</body>
</html>
