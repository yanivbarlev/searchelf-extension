<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      padding: 24px;
      color: #1a1a2e;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .header img { width: 40px; height: 40px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .desc { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 16px; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; color: #fff;
    }
    .info { font-size: 11px; color: #999; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <img id="popup-icon" src="imgs/icon-48.png" alt="icon">
    <h1 id="popup-name">Loading...</h1>
  </div>
  <p class="desc" id="popup-desc"></p>
  <span class="badge" id="popup-badge">Active</span>
  <p class="info">Visit canva.com and click the floating widget to see tips.</p>
  <script src="popup.js"></script>
</body>
</html>
